cambuffer_recorder_ng:
  ros__parameters:
    backend: "xiapi"
    mode: "raw8bayerGBRG_rolling"

    camera.width: 2048
    camera.height: 700
    camera.fps: 100.0
    camera.exposure_us: 2000.0
    camera.gain_db: 0.0
    camera.pixel_format: "raw8"
    camera.bayer_pattern: "GBRG"

    output.dir: "/tmp"
    output.prefix: "ximea_raw8bayerGBRG_rolling"

    rolling.max_file_gib: 2.0
    rolling.max_frames: 0
    rolling.pack_rows: true
