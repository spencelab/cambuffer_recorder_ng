cambuffer_recorder_ng:
  ros__parameters:
    backend: "xiapi"
    mode: "raw8bayerGBRG_rolling"

    camera.width: 2048
    camera.height: 700
    camera.fps: 100.0
    camera.exposure_us: 2000.0
    camera.gain_db: 0.0
    camera.pixel_format: "raw8"
    camera.bayer_pattern: "GBRG"

    output.dir: "/tmp"
    output.prefix: "ximea_raw8bayerGBRG_rolling"

    # Preview/conversion-only white balance gains. Recording stays raw8 Bayer;
    # raw_rolling_to_mp4 reads these from the metadata sidecar when making MP4 previews.
    pipeline.white_balance.enabled: true
    pipeline.white_balance.r_gain: 1.23
    pipeline.white_balance.g_gain: 1.00
    pipeline.white_balance.b_gain: 1.60

    rolling.max_file_gib: 2.0
    rolling.max_frames: 0
    rolling.pack_rows: true
