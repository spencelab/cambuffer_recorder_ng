cam1:
  ros__parameters:
    backend: "ximea"
    mode: "raw8bayerGBRG_rolling"

    camera.width: 2048
    camera.height: 700
    camera.offset_x: 0
    camera.offset_y: 194
    camera.fps: 100.0
    camera.expected_hardware_fps: 100.0
    camera.exposure_us: 2000.0
    camera.pixel_format: "bayer_gbrg8"
    camera.bayer_pattern: "GBRG"

    # Enable external hardware triggering on XIMEA.
    # XiAPI commonly uses selector 1 for the first physical GPI; XiCamTool may label it GPI 0.
    camera.hardware_trigger: true
    camera.grab_timeout_ms: 1000
    camera.timeout_warn_interval_s: 5.0
    camera.fps_report_interval_s: 5.0
    ximea.gpi_selector: 1
    ximea.trigger_edge: "rising"
    # xiAPI internal image queue. Default is small; 16 gives roughly 150 ms
    # cushion at 100 Hz if the application briefly falls behind.
    ximea.buffers_queue_size: 16

    output.dir: "/tmp"
    output.prefix: "ximea_hwtrig_raw8bayerGBRG_rolling"

    pipeline.white_balance.enabled: true
    pipeline.white_balance.r_gain: 1.23
    pipeline.white_balance.g_gain: 1.00
    pipeline.white_balance.b_gain: 1.60

    rolling.max_file_gib: 2.0
    rolling.max_frames: 0
    rolling.pack_rows: true
