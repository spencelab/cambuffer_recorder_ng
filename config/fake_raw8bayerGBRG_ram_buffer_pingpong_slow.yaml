cambuffer_recorder_ng:
  ros__parameters:
    backend: "fake"
    mode: "raw8bayerGBRG_ram_buffer"

    # NOT a shipped/production config -- this session's Level 2 timing-test
    # variant of fake_raw8bayerGBRG_ram_buffer_pingpong.yaml. XIMEA-sized
    # frames (2048x700) and a smaller ring make both "saving" (bigger drain
    # write) and "filling" (fewer frames to reach full) observable over
    # several seconds with plain sequential `ros2 service call` invocations,
    # which the tiny 320x240/1000-frame default config drains too fast for.
    camera.width: 2048
    camera.height: 700
    camera.fps: 250.0
    camera.expected_hardware_fps: 250.0
    camera.pixel_format: "bayer_gbrg8"
    camera.bayer_pattern: "GBRG"
    fake.realtime_pacing: "false"

    output.dir: "/tmp"
    output.prefix: "fake_raw8bayerGBRG_ram_buffer_pingpong_slow"

    pipeline.white_balance.enabled: true
    pipeline.white_balance.r_gain: 1.23
    pipeline.white_balance.g_gain: 1.00
    pipeline.white_balance.b_gain: 1.60

    rolling.max_file_gib: 2.0
    rolling.pack_rows: true

    raw.payload_crc32_enabled: true

    ram_buffer.capacity_frames: 250
    ram_buffer.dump_policy: "continue_acquisition"
    ram_buffer.default_trigger_position: "post_trigger"
    ram_buffer.default_window_s: 4.0
    ram_buffer.default_window_frames: 0
    ram_buffer.allow_partial_default: false
    ram_buffer.dump_wait_timeout_s: 30.0
